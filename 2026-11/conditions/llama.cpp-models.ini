; llama-server ルーターモード用プリセット
; パスはコンテナ内のパス（./models → /models）。~ や環境変数は展開されないので絶対パスで書く
; ここにないオプション（ctx-size など）は compose の環境変数の値を引き継ぐ
; spec-type = draft-mtp はモデル内蔵の MTP ヘッド (blk.*.nextn.*) がある場合のみ指定する
;   2026-11-19 確認: nextn テンソルを持つのは Qwen3.8-27B のみ
; split-mode = tensor (実験的) は対応アーキテクチャのみ。既定は compose 側の layer
;   tensor 時は --fit 非対応のため n-gpu-layers = all を併記する
;   llama-bench 実測 (2026-11-19, KV q8_0, 比率 2:1):
;     gemma-4-31B     : layer TG 30.0 / tensor TG 42.8 t/s → tensor
;     gemma-4-26B-A4B : layer TG 128  / tensor TG 105  t/s → layer (MoE は layer が速い)
;     gemma-4-12B     : tensor は生成時に GGML_ASSERT で落ちる → layer
version = 1

[qwen3.8-27b-ud-q4_k_m]
model = /models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_M.gguf
mmproj = /models/unsloth/Qwen3.8-27B-GGUF/mmproj-Qwen3.8-27B-BF16.gguf
spec-type = draft-mtp
split-mode = tensor
tensor-split = 2,1
n-gpu-layers = all
; サンプリング: モデルカードの thinking モードの推奨値（モデル比較 2026-11）
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

[qwen3.6-27b-q4_k_m]
model = /models/lmstudio-community/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
mmproj = /models/lmstudio-community/Qwen3.6-27B-GGUF/mmproj-Qwen3.6-27B-BF16.gguf
split-mode = tensor
tensor-split = 2,1
n-gpu-layers = all
; サンプリング: モデルカードの thinking モードの推奨値（モデル比較 2026-11 追加分）
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0

[gemma-4-31b-it-qat]
model = /models/lmstudio-community/gemma-4-31B-it-QAT-GGUF/gemma-4-31B-it-QAT-Q4_0.gguf
mmproj = /models/lmstudio-community/gemma-4-31B-it-QAT-GGUF/mmproj-gemma-4-31B-it-QAT-BF16.gguf
split-mode = tensor
; 2,1 は ctx 65536 + mmproj で 5070Ti が OOM になる
tensor-split = 1.5,1
n-gpu-layers = all
; サンプリング: モデルカードの推奨値（min-p はカードに無いので使わない）（モデル比較 2026-11）
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gemma-4-26b-a4b-it-qat]
model = /models/lmstudio-community/gemma-4-26B-A4B-it-QAT-GGUF/gemma-4-26B-A4B-it-QAT-Q4_0.gguf
mmproj = /models/lmstudio-community/gemma-4-26B-A4B-it-QAT-GGUF/mmproj-gemma-4-26B-A4B-it-QAT-BF16.gguf
cache-type-k = f16
cache-type-v = f16
; サンプリング: モデルカードの推奨値（min-p はカードに無いので使わない）（モデル比較 2026-11 追加分）
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gpt-oss-20b-mxfp4]
model = /models/ggml-org/gpt-oss-20b-GGUF/gpt-oss-20b-MXFP4.gguf
; サンプリング: OpenAI の gpt-oss README の推奨値（temperature 1.0 / top_p 1.0。top_k・min_p は使わない）（モデル比較 2026-11 追加分）
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0

[gemma-4-12b-it-qat]
model = /models/lmstudio-community/gemma-4-12B-it-QAT-GGUF/gemma-4-12B-it-QAT-Q4_0.gguf
mmproj = /models/lmstudio-community/gemma-4-12B-it-QAT-GGUF/mmproj-gemma-4-12B-it-QAT-BF16.gguf
; サンプリング: モデルカードの推奨値（min-p はカードに無いので使わない）（モデル比較 2026-11）
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0

[gemma4-e4b-it-qat]
model = /models/ollama/gemma4-e4b-it-qat/gemma4-e4b-it-qat.gguf
mmproj = /models/ollama/gemma4-e4b-it-qat/mmproj-gemma4-e4b-it-qat.gguf

[llm-jp-4.1-32b-a3b-thinking]
model = /models/llm-jp/llm-jp-4.1-32b-a3b-thinking-gguf/llm-jp-4.1-32b-a3b-thinking-Q4_K_M.gguf

[llm-jp-4.1-33b-thinking]
model = /models/llm-jp/llm-jp-4.1-33b-thinking-gguf/llm-jp-4.1-33b-thinking-Q4_K_M.gguf
split-mode = tensor
tensor-split = 1,1
n-gpu-layers = all
; KV は f16、コンテキストは 32k（モデル比較 2026-11）。
;   f16 + ctx 65536 は読み込みで OOM、q8_0 + tensor 分割は生成が 0.86 t/s に落ちる（2026-11-21）
cache-type-k = f16
cache-type-v = f16
ctx-size = 32768
; サンプリングはカードに推奨値が無いので指定しない（llama.cpp の既定）

[llm-jp-4.1-8b-thinking]
model = /models/llm-jp/llm-jp-4.1-8b-thinking-gguf/llm-jp-4.1-8b-thinking-Q4_K_M.gguf
